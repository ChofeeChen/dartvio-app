[versions]
agp = "9.3.0"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.6.1"
activityCompose = "1.8.0"
kotlin = "2.2.10"
composeBom = "2026.02.01"
navigationCompose = "2.7.7"
lifecycleViewmodelCompose = "2.7.0"
coroutines = "1.8.0"
# KSP 版本必须与 Kotlin 编译器版本严格一致（前缀 = Kotlin 版本）
ksp = "2.2.10-2.0.2"
room = "2.7.2"
# M5 实时同步：内嵌 Ktor server（Host 权威节点）+ WS 客户端。
#
# 刻意停在 2.3.x 而非 3.x：本项目 minSdk = 24 且**刻意未开启 core library desugaring**
# （见 domain/room/OfficialArena.kt 与 LocalDateKey 的说明）。Ktor 3.x 的核心路径引入了
# java.time，在 API 24/25 上会在**运行期**抛 NoClassDefFoundError —— 这类问题编译期发现不了，
# 只能靠设备实测撞上。2.3.x 的 CIO/WebSocket 路径只依赖 java.nio 与 java.util.Calendar，
# 与 minSdk 24 相容，因此选它换取「不引入新风险」。
ktor = "2.3.12"
# 仅使用 kotlinx-serialization-json 的 JsonElement API（手写编解码），
# 因此**不需要** Kotlin 序列化编译器插件，避免再增加一个与 AGP 9 内置 Kotlin 耦合的版本变量。
serializationJson = "1.6.3"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
# Room：本地对局历史持久化（M9 第①期）
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
# M5 实时同步：Host 端内嵌 Ktor server（CIO 引擎，纯 Kotlin/NIO，无 Netty）
ktor-server-core = { group = "io.ktor", name = "ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { group = "io.ktor", name = "ktor-server-cio", version.ref = "ktor" }
ktor-server-websockets = { group = "io.ktor", name = "ktor-server-websockets", version.ref = "ktor" }
# M5 实时同步：客户端 WS 连接
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { group = "io.ktor", name = "ktor-client-cio", version.ref = "ktor" }
ktor-client-websockets = { group = "io.ktor", name = "ktor-client-websockets", version.ref = "ktor" }
# 协议层 JSON 编解码（纯 Kotlin，单测与真机共用同一实现）
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# KMP：shared 模块（domain / rules / stats 下沉，两端共用）。版本与 Kotlin 编译器严格一致。
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
# AGP 9 起，KMP 库模块必须用这个插件（com.android.library 与 KMP 插件不兼容）。
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
